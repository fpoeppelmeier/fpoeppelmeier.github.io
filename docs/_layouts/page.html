---
layout: default
---
<header class="page-hero">
  <div class="container narrow">
    {%- if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
    <h1>{{ page.title }}</h1>
    {%- if page.subtitle %}<p class="page-subtitle">{{ page.subtitle }}</p>{% endif %}
  </div>
</header>
<article class="container narrow prose">
  {{ content }}
</article>
